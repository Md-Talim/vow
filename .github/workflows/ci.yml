name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: vow_test
          POSTGRES_USER: vow
          POSTGRES_PASSWORD: vow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vow -d vow_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Vet
        run: go vet ./...

      - name: Test
        env:
          DATABASE_URL: postgres://vow:vow@localhost:5432/vow_test
        run: go test ./...